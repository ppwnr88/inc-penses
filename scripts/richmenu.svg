
<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="2500" height="1686" fill="#4a5e3a" rx="0"/>

  <!-- Left brand panel -->
  <rect x="20" y="20" width="1460" height="1646" fill="#f5f0e8" rx="48"/>

  <!-- Brand text: เงินจด -->
  <text x="750" y="380"
    font-family="'Sarabun','Noto Sans Thai',sans-serif"
    font-size="220" font-weight="900"
    fill="#84a06e" text-anchor="middle">เงินจด</text>

  <!-- Subtitle -->
  <text x="750" y="530"
    font-family="'Sarabun','Noto Sans Thai',sans-serif"
    font-size="90" font-weight="600"
    fill="#2d3b22" text-anchor="middle" opacity="0.75">จดรายรับ · รายจ่าย</text>

  <!-- Coin icon area -->
  <circle cx="750" cy="950" r="280" fill="#84a06e" opacity="0.12"/>
  <circle cx="750" cy="950" r="220" fill="#84a06e" opacity="0.12"/>
  <g transform="translate(600, 800) scale(3)" color="#84a06e"><circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="6"/>
          <text x="50" y="58" font-size="36" text-anchor="middle" fill="currentColor" font-weight="bold">฿</text></g>

  <!-- Tap hint -->
  <text x="750" y="1420"
    font-family="'Sarabun','Noto Sans Thai',sans-serif"
    font-size="64" font-weight="500"
    fill="#84a06e" text-anchor="middle" opacity="0.8">แตะเพื่อเปิดแอป →</text>

  <!-- ===== RIGHT BUTTONS ===== -->

