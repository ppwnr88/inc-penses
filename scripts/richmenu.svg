  <rect x="1518" y="580" width="464" height="526" fill="#a8c090" rx="40"/>
  <g transform="translate(1680, 705.56) scale(1.4)" color="#2d3b22"><circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="14" stroke-dasharray="66 134"/>
          <circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="14" stroke-dasharray="44 156" stroke-dashoffset="-66" opacity="0.6"/>
          <circle cx="50" cy="50" r="15" fill="currentColor" opacity="0.2"/></g>
  <text x="1750" y="989.12" font-family="'Sarabun', 'Noto Sans Thai', sans-serif" font-size="72" font-weight="700" fill="#2d3b22" text-anchor="middle" dominant-baseline="middle">หมวด/งบ</text>

  <rect x="2018" y="580" width="464" height="526" fill="#7a9b5e" rx="40"/>
  <g transform="translate(2180, 705.56) scale(1.4)" color="#fffdf7"><rect x="15" y="20" width="70" height="10" rx="5" fill="currentColor"/>
