  <rect x="1518" y="18" width="464" height="526" fill="#84a06e" rx="40"/>
  <g transform="translate(1680, 143.56) scale(1.4)" color="#fffdf7"><path d="M50,15 L85,45 L85,85 L60,85 L60,62 L40,62 L40,85 L15,85 L15,45 Z" fill="currentColor"/>
         <path d="M50,15 L85,45" stroke="currentColor" stroke-width="4" fill="none"/></g>
  <text x="1750" y="427.12" font-family="'Sarabun', 'Noto Sans Thai', sans-serif" font-size="72" font-weight="700" fill="#fffdf7" text-anchor="middle" dominant-baseline="middle">สรุป</text>

  <rect x="2018" y="18" width="464" height="526" fill="#6a8557" rx="40"/>
  <g transform="translate(2180, 143.56) scale(1.4)" color="#fffdf7"><circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="8" stroke-dasharray="55 165" stroke-dashoffset="0"/>
          <circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="8" stroke-dasharray="40 180" stroke-dashoffset="-55" opacity="0.7"/>
          <circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="8" stroke-dasharray="30 190" stroke-dashoffset="-95" opacity="0.5"/></g>
