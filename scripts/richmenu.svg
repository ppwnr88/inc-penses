          <circle cx="50" cy="50" r="8" fill="white"/>
          <rect x="71" y="43" width="14" height="14" rx="4" fill="currentColor" transform="rotate(0 78 50)"/><rect x="62.798989873223334" y="62.79898987322332" width="14" height="14" rx="4" fill="currentColor" transform="rotate(45 69.79898987322333 69.79898987322332)"/><rect x="43" y="71" width="14" height="14" rx="4" fill="currentColor" transform="rotate(90 50 78)"/><rect x="23.201010126776673" y="62.798989873223334" width="14" height="14" rx="4" fill="currentColor" transform="rotate(135 30.201010126776673 69.79898987322333)"/><rect x="15" y="43" width="14" height="14" rx="4" fill="currentColor" transform="rotate(180 22 50)"/><rect x="23.201010126776666" y="23.201010126776673" width="14" height="14" rx="4" fill="currentColor" transform="rotate(225 30.201010126776666 30.201010126776673)"/><rect x="42.99999999999999" y="15" width="14" height="14" rx="4" fill="currentColor" transform="rotate(270 49.99999999999999 22)"/><rect x="62.79898987322332" y="23.201010126776666" width="14" height="14" rx="4" fill="currentColor" transform="rotate(315 69.79898987322332 30.201010126776666)"/></g>
  <text x="1750" y="1551.12" font-family="'Sarabun', 'Noto Sans Thai', sans-serif" font-size="72" font-weight="700" fill="#2d3b22" text-anchor="middle" dominant-baseline="middle">ตั้งค่า</text>

  <rect x="2018" y="1142" width="464" height="526" fill="#5b8a7a" rx="40"/>
  <g transform="translate(2180, 1267.56) scale(1.4)" color="#fffdf7"><path d="M25,35 Q25,15 50,15 Q75,15 75,35 Q75,50 50,55 L50,65" stroke="currentColor" stroke-width="9" fill="none" stroke-linecap="round"/>
          <circle cx="50" cy="80" r="6" fill="currentColor"/></g>
  <text x="2250" y="1551.12" font-family="'Sarabun', 'Noto Sans Thai', sans-serif" font-size="72" font-weight="700" fill="#fffdf7" text-anchor="middle" dominant-baseline="middle">Help</text>
